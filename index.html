<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✧ Elite Chess ✧</title>
    <link rel="icon" href="favicon.png" type="image/png">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/chessboard-1.0.0.css">
    <link rel="stylesheet" href="move-indicators.css">
    <link rel="stylesheet" href="ayanokoji-profile.css">
</head>
<body>

    <video id="bg-video" autoplay muted loop playsinline>
        <source id="video-source" src="" type="video/mp4">
    </video>

    <div class="glass-overlay"></div>

    <!-- بروفايل أيانوكوجي -->
    <div class="ayanokoji-profile">
        <div class="profile-image-container">
            <div class="profile-image">
                <img src="ayanokoji.png" alt="Ayanokoji" 
                     onerror="this.src='https://via.placeholder.com/120x120/1a1a1a/ffffff?text=Ayanokoji'">
            </div>
        </div>
        
        <div class="profile-info">
            <h3 class="profile-name">Ayanokoji Kiyotaka</h3>
            <p class="profile-elo">ELO: 2000+</p>
            <p class="profile-quote">سيتساهل معك<br>وقد يتركك تفوز</p>
        </div>
        
        <div class="thinking-indicator" id="ayanokoji-thinking">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>

    <div id="board-container"></div>

    <script src="script.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/chess.js"></script>
    <script src="js/chessboard-1.0.0.js"></script>
    <script src="ayanokoji-ai.js"></script>
    <script src="init.js"></script>
</body>
</html>
